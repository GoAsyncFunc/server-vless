name: Release

on:
  push:
    tags:
      - 'v*'

jobs:
  build:
    name: Build
    runs-on: ubuntu-latest
    strategy:
      matrix:
        include:
          - goos: linux
            goarch: amd64
          - goos: linux
            goarch: arm64
    steps:
      - name: Checkout
        uses: actions/checkout@v7
        with:
          fetch-depth: 0

      - name: Set up Go
        uses: actions/setup-go@v7
        with:
          go-version: '1.27'
          check-latest: true

      - name: Run tests
        run: go test -v ./...

      - name: Fetch geo data
        run: sh build/package/fetch-geo-assets.sh "$RUNNER_TEMP/geo"

      - name: Build
        env:
          GOOS: ${{ matrix.goos }}
          GOARCH: ${{ matrix.goarch }}
          CGO_ENABLED: 0
        run: |
          mkdir -p build
          BINARY_NAME=vless-node-${{ matrix.goos }}-${{ matrix.goarch }}
          go build -v -trimpath -ldflags "-s -w -X main.Version=${{ github.ref_name }}" -o build/${BINARY_NAME} ./cmd/server

      # The tarball is the self-contained form: geoip.dat is required for the
      # node to start, so a bare binary without it is not a complete install.
      # The bare binary stays in the release for existing install scripts.
      - name: Package
        run: |
          pkg="vless-node-${{ matrix.goos }}-${{ matrix.goarch }}"
          mkdir -p "${pkg}"
          cp "build/${pkg}" "${pkg}/vless-node"
          cp "$RUNNER_TEMP/geo/geoip.dat" "$RUNNER_TEMP/geo/geosite.dat" "${pkg}/"
          tar -czf "build/${pkg}.tar.gz" "${pkg}"
          rm -rf "${pkg}"

      - name: Upload artifacts
        uses: actions/upload-artifact@v7
        with:
          name: vless-node-${{ matrix.goos }}-${{ matrix.goarch }}
          path: build/*

  release:
    name: Create Release
    runs-on: ubuntu-latest
    needs: build
    permissions:
      contents: write
    if: startsWith(github.ref, 'refs/tags/')
    steps:
      - name: Download artifacts
        uses: actions/download-artifact@v8
        with:
          path: assets
          merge-multiple: true

      - name: Create Release and Upload Assets
        uses: softprops/action-gh-release@v3
        with:
          files: assets/*
          generate_release_notes: true
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
