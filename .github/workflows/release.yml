name: Release

on:
  push:
    tags:
      # Keep in step with docker-publish.yml: a tag that reaches one workflow
      # and not the other ships half a release.
      - 'v*'

# Least privilege for the build job, which only reads the repository. The
# release job below overrides this with contents: write, which it needs to
# create the release.
permissions:
  contents: read

jobs:
  build:
    name: Build
    runs-on: ubuntu-latest
    strategy:
      matrix:
        include:
          - goos: linux
            goarch: amd64
          - goos: linux
            goarch: arm64
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          fetch-depth: 0

      # Same Go as CI and the Dockerfile: the toolchain line in go.mod.
      - name: Set up Go
        uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7
        with:
          go-version-file: go.mod

      - name: Run tests
        run: go test -v ./...

      - name: Fetch geo data
        run: sh build/package/fetch-geo-assets.sh "$RUNNER_TEMP/geo"

      - name: Build
        env:
          GOOS: ${{ matrix.goos }}
          GOARCH: ${{ matrix.goarch }}
          CGO_ENABLED: 0
        run: |
          mkdir -p build
          BINARY_NAME=vless-node-${{ matrix.goos }}-${{ matrix.goarch }}
          go build -v -trimpath -ldflags "-s -w -X main.Version=${{ github.ref_name }}" -o build/${BINARY_NAME} ./cmd/server

      # The tarball is the self-contained form: geoip.dat is required for the
      # node to start, so a bare binary without it is not a complete install.
      # The bare binary stays in the release for existing install scripts.
      - name: Package
        run: |
          pkg="vless-node-${{ matrix.goos }}-${{ matrix.goarch }}"
          mkdir -p "${pkg}"
          cp "build/${pkg}" "${pkg}/vless-node"
          cp "$RUNNER_TEMP/geo/geoip.dat" "$RUNNER_TEMP/geo/geosite.dat" "${pkg}/"
          tar -czf "build/${pkg}.tar.gz" "${pkg}"
          rm -rf "${pkg}"

      - name: Upload artifacts
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7
        with:
          name: vless-node-${{ matrix.goos }}-${{ matrix.goarch }}
          path: build/*

  release:
    name: Create Release
    runs-on: ubuntu-latest
    needs: build
    permissions:
      contents: write
    if: startsWith(github.ref, 'refs/tags/')
    steps:
      - name: Download artifacts
        uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8
        with:
          path: assets
          merge-multiple: true

      - name: Create Release and Upload Assets
        uses: softprops/action-gh-release@efb35369e0ad2afab669f228072c1b0d510eae64 # v3
        with:
          files: assets/*
          generate_release_notes: true
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
