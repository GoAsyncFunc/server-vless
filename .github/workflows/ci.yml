name: CI

on:
  push:
    branches:
      - master
      - main
      - dev
  pull_request:
    branches:
      - master
      - main

# Least privilege. Without this the job token falls back to the repository's
# default, which can be read-write-all -- and these jobs run third-party
# actions and code from pull requests. Both jobs only read the repository:
# checkout, go test, and golangci-lint, whose own README asks for contents: read
# and nothing more. pull-requests: read would only be needed for
# only-new-issues, which this workflow does not set.
permissions:
  contents: read

jobs:
  lint:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Set up Go
        uses: actions/setup-go@v7
        with:
          go-version: '1.27'
          check-latest: true

      # The v2 line is required, not cosmetic: v1 cannot parse Go 1.27 source,
      # which is what the old commented-out step was waiting on. Pinned to the
      # version `make lint_install` installs so local and CI cannot drift.
      - name: golangci-lint
        uses: golangci/golangci-lint-action@v9
        with:
          version: v2.14.0
          args: --timeout=5m

  test:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Set up Go
        uses: actions/setup-go@v7
        with:
          go-version: '1.27'
          check-latest: true

      - name: Download dependencies
        run: go mod download

      - name: Run tests
        run: go test -v -race -coverprofile=coverage.out ./...

      - name: Test load driver
        run: python3 -m unittest discover -s scripts -p 'test_*.py' -v

      - name: Build
        run: go build -v ./...
