name: CI

on:
  push:
    branches:
      - master
      - main
      - dev
  pull_request:
    branches:
      - master
      - main
      - dev

# Least privilege. Without this the job token falls back to the repository's
# default, which can be read-write-all -- and these jobs run third-party
# actions and code from pull requests. Both jobs only read the repository:
# checkout, go test, and golangci-lint, whose own README asks for contents: read
# and nothing more. pull-requests: read would only be needed for
# only-new-issues, which this workflow does not set.
permissions:
  contents: read

jobs:
  lint:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7

      # The Go version is the toolchain line in go.mod, so this workflow, the
      # release workflow and the Dockerfile cannot drift apart. It is a pin,
      # not a floor: check-latest used to float these jobs to whatever 1.27.x
      # was newest while the image shipped something else.
      - name: Set up Go
        uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7
        with:
          go-version-file: go.mod

      # The v2 line is required, not cosmetic: v1 cannot parse Go 1.27 source,
      # which is what the old commented-out step was waiting on. Pinned to the
      # version `make lint_install` installs so local and CI cannot drift.
      - name: golangci-lint
        uses: golangci/golangci-lint-action@ba0d7d2ec06a0ea1cb5fa41b2e4a3ab91d21278a # v9
        with:
          version: v2.14.0
          args: --timeout=5m

  test:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7

      - name: Set up Go
        uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7
        with:
          go-version-file: go.mod

      - name: Download dependencies
        run: go mod download

      - name: Run tests
        run: go test -v -race -coverprofile=coverage.out ./...

      - name: Test load driver
        run: python3 -m unittest discover -s scripts -p 'test_*.py' -v

      - name: Build
        run: go build -v ./...

      # Pinned, and installed through the module proxy and checksum database
      # like the other tools. Source mode panics on this module's dependency
      # graph (x/vuln v1.3.0, "panic: Int" inside the Xray-core fork), and the
      # binary we ship is the thing the question is about anyway, so scan that.
      - name: Install govulncheck
        run: go install golang.org/x/vuln/cmd/govulncheck@v1.3.0

      - name: govulncheck
        run: |
          go build -trimpath -o vless-node ./cmd/server
          govulncheck -mode binary ./vless-node

  workflow-lint:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7

      - name: Set up Go
        uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7
        with:
          go-version-file: go.mod

      # actionlint ships no GitHub Action, so this goes through the Makefile
      # instead of repeating the version here. shellcheck is preinstalled on
      # this runner, which means actionlint also checks the shell in every
      # `run:` block -- that is the stronger half of the check and it does not
      # run on a developer machine without shellcheck installed.
      - name: Install actionlint
        run: make actionlint_install

      - name: Check workflow files
        run: make actionlint
